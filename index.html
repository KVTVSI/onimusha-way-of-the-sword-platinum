/* ===== ЯДРО ===== */
const D = DATA || {meta: {}, sources: {}, stages: [], trophies: []};
const M = D.meta || {};
const SLUG = 'onimusha-way-of-the-sword';
const LS = 'plat-guide:onimusha-way-of-the-sword:v1:';
const TABS = ['now', 'plan', 'trophies', 'extras', 'info'];
const TYPES = ['platinum', 'gold', 'silver', 'bronze'];
const TYPE_RU = {platinum: 'Платина', gold: 'Золото', silver: 'Серебро', bronze: 'Бронза'};
const $ = (s, r = document) => r.querySelector(s);

// localStorage: всё в try/catch
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(LS + k); } catch (e) {} }
};

// как norm() в sync/make_progress.py (str.split() Python = пробелы JS + \x1c-\x1f\x85)
function norm(s) {
  return String(s).toLowerCase()
    .replace(/[‘’‛`´]/g, "'")
    .replace(/[‐-―−]/g, '-')
    .replace(/[​-‍﻿]/g, '')
    .split(/[\s\x1c-\x1f\x85]+/).filter(Boolean).join(' ');
}

// DOM-помощник: строки — только как текст
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  add(n, kids);
  return n;
}
function add(n, kids) {
  for (const c of kids) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) add(n, c);
    else n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
const fill = (el, ...kids) => { el.replaceChildren(); return add(el, kids); }
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : null;

// даты
const pad = x => String(x).padStart(2, '0');
const MON = {jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12};
function psnDate(s) { // «31st Jul 2026» → «31.07.2026»; иначе как есть
  s = String(s || '').trim();
  const m = /^(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3})[A-Za-z]*\.?,?\s+(\d{4})/.exec(s);
  return m && MON[m[2].toLowerCase()] ? pad(m[1]) + '.' + pad(MON[m[2].toLowerCase()]) + '.' + m[3] : s;
}
function isoDate(s, withTime) {
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; }
  const d = new Date(s);
  if (isNaN(d)) return String(s);
  return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + (withTime ? ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : '');
}
const ymd = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

// трофеи и этапы
const T = D.trophies || [];
const byNum = new Map(T.map(t => [t.num, t]));
const byKey = new Map(T.map(t => [norm(t.en), t]));
const STAGES = (D.stages || []).slice().sort((a, b) => (a.dlc ? 1 : 0) - (b.dlc ? 1 : 0));
const stageById = new Map(STAGES.map(s => [s.id, s]));
const stageTrophies = s => (s && s.trophies || []).map(n => byNum.get(n)).filter(Boolean);
const HAS_PLAT = M.hasPlatinum !== false;
const inMain = t => !HAS_PLAT || !t.dlc; // без платины считаем всё
const HAS_EXTRAS = Array.isArray(M.collectibles) && M.collectibles.length > 0;
const AVAIL = TABS.filter(t => t !== 'extras');

// состояние
const S = {
  psn: new Map(),            // num → строка даты из progress.json
  psnUpdated: '', psnOk: false,
  manual: new Set(),         // num
  fresh: [],                 // num: новые с последней сверки
  spoilAll: !!store.get('spoilers', false),
  revealed: new WeakSet(),   // раскрытые спойлеры (элементы текста)
  pin: store.get('pin', null),
  filters: Object.assign({stage: '', type: '', undone: false, dlc: false, missable: false, online: false, buggy: false, unverified: false}, store.get('filters', {})),
  group: store.get('group', 'stage'),
  fltOpen: !!store.get('fltOpen', false),
  q: '',
  planOpen: new Set(),
  scroll: Object.assign({}, store.get('scroll', {})),
  tab: null,
  sheet: null
};
if (!['stage', 'type', 'status'].includes(S.group)) S.group = 'stage';
if (S.pin && !stageById.has(S.pin)) S.pin = null;

// ручной слой (хранится английскими названиями)
function loadManual() {
  const a = store.get('manual', []);
  S.manual = new Set((Array.isArray(a) ? a : []).map(n => byKey.get(norm(n))).filter(Boolean).map(t => t.num));
}
function saveManual() { store.set('manual', [...S.manual].map(n => byNum.get(n).en)); }
const isPsn = n => S.psn.has(n);
const isManual = n => S.manual.has(n);
const isDone = n => S.psn.has(n) || S.manual.has(n);
const psnDateOf = n => S.psn.has(n) ? psnDate(S.psn.get(n)) : '';
function setManual(num, on) {
  num = Number(num);
  if (!byNum.has(num)) return false;
  if (on) S.manual.add(num); else S.manual.delete(num);
  saveManual();
  refresh();
  return true;
}

// счётчики (объединение слоёв)
function stat(list) { let d = 0; for (const t of list) if (isDone(t.num)) d++; return {done: d, total: list.length, pct: list.length ? Math.round(d * 100 / list.length) : 0}; }
function counts() {
  const main = T.filter(inMain), dlc = T.filter(t => t.dlc);
  const byType = {}, dlcByType = {}, byStage = {};
  for (const ty of TYPES) { byType[ty] = stat(main.filter(t => t.type === ty)); dlcByType[ty] = stat(dlc.filter(t => t.type === ty)); }
  for (const s of STAGES) byStage[s.id] = stat(stageTrophies(s));
  return {main: stat(main), dlc: stat(dlc), all: stat(T), byType, dlcByType, byStage};
}

// текущий этап
const PLAT = T.find(t => t.type === 'platinum') || null;
function platDone() {
  if (PLAT && isDone(PLAT.num)) return true;
  const tr = HAS_PLAT ? STAGES.filter(s => !s.dlc).flatMap(stageTrophies) : T;
  return tr.length > 0 && tr.every(t => isDone(t.num));
}
function currentStage() {
  if (S.pin && stageById.has(S.pin)) return {stage: stageById.get(S.pin), pinned: true};
  if (platDone()) return {stage: null, done: true};
  const a = STAGES.filter(s => !s.dlc).find(s => stageTrophies(s).some(t => !isDone(t.num)));
  return {stage: a || STAGES.find(s => !s.dlc) || STAGES[0] || null};
}
function pinStage(id) { S.pin = id && stageById.has(id) ? id : null; if (S.pin) store.set('pin', S.pin); else store.del('pin'); refresh(); }

// «новое с последней сверки»: {seen:[en], fresh:[en], upd}
function updateFresh() {
  const cur = [...S.psn.keys()].map(n => byNum.get(n).en);
  const rec = store.get('seen', null);
  if (!rec || !Array.isArray(rec.seen)) { store.set('seen', {seen: cur, fresh: [], upd: S.psnUpdated}); S.fresh = []; return; }
  let fresh = Array.isArray(rec.fresh) ? rec.fresh : [];
  if (rec.upd !== S.psnUpdated) {
    const seen = new Set(rec.seen.map(norm));
    fresh = cur.filter(n => !seen.has(norm(n)));
    store.set('seen', {seen: [...new Set([...rec.seen, ...cur])], fresh, upd: S.psnUpdated});
  }
  S.fresh = fresh.map(n => byKey.get(norm(n))).filter(t => t && isPsn(t.num)).map(t => t.num);
}

// слой PSN
let psnSig = '';
async function loadPsn() {
  try {
    const r = await fetch('progress.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !Array.isArray(j.earned)) return;
    const m = new Map();
    for (const e of j.earned) { const t = e && byKey.get(norm(e.name)); if (t) m.set(t.num, String(e.date || '')); }
    const sig = String(j.updated || '') + '|' + [...m].join(';');
    S.psn = m; S.psnUpdated = String(j.updated || ''); S.psnOk = true;
    updateFresh();
    if (sig !== psnSig) { psnSig = sig; refresh(); }
  } catch (e) { /* молча: работаем по ручному слою */ }
}

// спойлеры
const spoilHidden = it => !!(it && it.spoiler) && !S.spoilAll && !S.revealed.has(it);
function setSpoilAll(on) { S.spoilAll = !!on; store.set('spoilers', S.spoilAll); refresh(); }
function revealSpoiler(it) { if (it) S.revealed.add(it); }

// поиск, фильтры, группировка
const sNorm = s => norm(s).replace(/ё/g, 'е');
function searchText(t) { // имена, описание и не скрытые советы
  return sNorm([t.ru, t.en, t.desc, ...(t.tips || []).filter(it => !spoilHidden(it)).map(it => it.text)].join(' '));
}
const hasUnverified = t => (t.tips || []).some(it => (it.labels || []).some(l => l === 'Не подтверждено' || l === 'Устарело?'));
function setFilters(p) { Object.assign(S.filters, p); store.set('filters', S.filters); }
function resetFilters() { setFilters({stage: '', type: '', undone: false, dlc: false, missable: false, online: false, buggy: false, unverified: false}); }
function setGroup(g) { if (['stage', 'type', 'status'].includes(g)) { S.group = g; store.set('group', g); } }
function setFltOpen(on) { S.fltOpen = !!on; store.set('fltOpen', S.fltOpen); }
function filtered() {
  const f = S.filters, q = sNorm(S.q);
  return T.filter(t => (!f.stage || t.stage === f.stage) && (!f.type || t.type === f.type) && (!f.undone || !isDone(t.num)) &&
    (!f.dlc || t.dlc) && (!f.missable || t.missable) && (!f.online || t.online) && (!f.buggy || t.buggy) &&
    (!f.unverified || hasUnverified(t)) && (!q || searchText(t).includes(q)));
}
function grouped(list) {
  let g;

    !HAS_PLAT ? h('p', {class: 'note'}, 'У игры нет платины: прогресс считается по всем трофеям.') : null,
    h('ul', {class: 'flags'}, [['online', 'Онлайн-трофеи'], ['missable', 'Пропускаемые'], ['bugs', 'Баги'], ['grind', 'Гринд']].map(([k, l]) => h('li', {class: 'flg' + (fl[k] ? ' yes' : '')}, l + ': ' + (fl[k] ? 'есть' : 'нет')))),
    unoff ? h('p', {class: 'unoff-all'}, unoff === T.length ? 'Русские названия и описания трофеев — неофициальный перевод.' : 'Неофициальный перевод у ' + unoff + ' трофеев из ' + T.length + ' (помечено в карточке трофея).') : null,
    orn(),
    (M.conflicts || []).length ? [secH('Расхождения источников', null), h('div', {class: 'conflicts'}, M.conflicts.map(x => h('div', {class: 'conflict'}, h('h3', {class: 'cf-h'}, x.topic || ''), itemsList(x.variants || []))))] : null,
    (M.unverified || []).length ? [secH('Что не удалось проверить', null), h('ul', {class: 'items unv'}, M.unverified.map(u => h('li', {class: 'item'}, h('span', {class: 'txt'}, u))))] : null,
    src.length ? [secH('Источники', null), h('ul', {class: 'srcs src-list'}, src.map(([id, s]) => { const u = safeUrl(s.url); return h('li', null, u ? h('a', {href: u, target: '_blank', rel: 'noopener noreferrer'}, s.site || id) : h('span', null, s.site || id), s.title ? h('span', {class: 'src-t'}, s.title) : null); }))] : null,
    h('p', {class: 'muted small'}, 'Данные собраны: ' + (isoDate(M.collectedAt) || 'нет даты') + (M.version ? ' · версия: ' + M.version : '')),
    orn(),
    secH('Настройки', null),
    h('div', {class: 'row'}, h('button', {type: 'button', class: 'btn', 'aria-pressed': String(S.spoilAll), onclick: () => setSpoilAll(!S.spoilAll)}, icon(S.spoilAll ? 'eye' : 'eyeOff'), S.spoilAll ? 'Скрыть спойлеры' : 'Показать все спойлеры')),
    secH('Ручные отметки', null, 'h3'),
    h('p', {class: 'muted'}, 'Ручных отметок: ' + S.manual.size + '. Экспорт, импорт и сброс касаются только их; отметки PSN не меняются.'),
    h('div', {class: 'row'},
      h('button', {type: 'button', class: 'btn', onclick: exportFile}, 'Экспорт'),
      h('button', {type: 'button', class: 'btn', onclick: async () => { copyMsg.textContent = await copyExport() ? 'Скопировано' : 'Не удалось скопировать'; }}, 'Скопировать'), copyMsg),
    secH('Импорт', null, 'h3'),
    h('div', {class: 'imp'}, file, ta,
      h('div', {class: 'row'}, h('button', {type: 'button', class: 'btn', onclick: () => check(ta.value)}, 'Проверить текст')),
      msg, acts),
    secH('Сброс', null, 'h3'),
    h('div', {class: 'row'}, h('button', {type: 'button', class: 'btn danger', onclick: () => { if (confirm('Сбросить все ручные отметки? Отметки PSN останутся.')) { infoNote = 'Ручные отметки сброшены.'; resetManual(); } }}, 'Сбросить ручные отметки')));
}

// ---- шторка ----
function renderSheet(t, el) {
  if (!t) return;
  const st = stageById.get(t.stage), d = psnDateOf(t.num), man = isManual(t.num), r = rarNum(t);
  const fl = [t.missable && 'Пропускаемый', t.online && 'Онлайн', t.buggy && 'Возможен баг', t.grind && 'Гринд'].filter(Boolean);
  const rar = t.rarity ? t.rarity + (RAR_RU[t.rarityLabel] ? ' · ' + RAR_RU[t.rarityLabel] : '') : '';
  fill(el,
    h('div', {class: 'sh-head t-' + t.type + (isDone(t.num) ? ' done' : '') + (justMarked === t.num ? ' just' : '')},
      h('div', {class: 'sh-cup'}, icon('cup', 'tc')),
      h('div', {class: 'names'},
        h('h2', {id: 'sheet-title', class: 'tru'}, h('span', null, t.ru), t.hidden ? hidIcon() : null),
        h('p', {class: 'ten', lang: 'en'}, t.en),
        !t.ruOfficial || !t.descOfficial ? h('p', {class: 'unoff'}, 'неофициальный перевод') : null)),
    h('p', {class: 'desc'}, t.desc),
    h('div', {class: 'chips'},
      h('span', {class: 'chip ty t-' + t.type}, TYPE_RU[t.type]),
      rar ? h('span', {class: 'chip' + (r < 10 ? ' rare' : '')}, rar) : null,
      st ? h('span', {class: 'chip'}, splitTitle(st.title)[0] || st.title) : null,
      t.dlc ? h('span', {class: 'chip'}, 'DLC') : null,
      fl.map(f => h('span', {class: 'chip' + (f === 'Гринд' ? '' : ' warn')}, f))),
    isPsn(t.num) ? h('div', {class: 'sh-st'}, markNode(t), h('span', null, 'Получено' + (d ? ' ' + d : '')), h('span', {class: 'muted small'}, 'отметка PSN, не снимается'))
      : h('div', {class: 'sh-st'}, h('button', {type: 'button', class: 'btn man-btn' + (man ? ' on' : ''), 'aria-pressed': String(man),
        onclick: () => { justMarked = man ? null : t.num; setManual(t.num, !man); justMarked = null; }}, h('span', {class: 'mk'}, icon('check')), man ? 'Снять ручную отметку' : 'Отметить вручную')),
    t.tips && t.tips.length ? [orn(), h('section', {class: 'how'}, h('h3', {class: 'sub-h'}, 'Как получить'), itemsList(t.tips))] : null);
}
// @@SCREENS:END@@

// старт
function init() {
  document.title = 'Платина: ' + (M.gameRu || M.gameEn || 'Onimusha: Way of the Sword');
  if (sheetState()) history.replaceState(null, '');
  try { history.scrollRestoration = 'manual'; } catch (e) {} // иначе «назад» подставляет прокрутку записи до saveScroll старой вкладки
  loadManual();
  renderHeader($('#hdr'));
  let t = hashTab();
  if (!t) { const last = store.get('tab', 'now'); t = AVAIL.includes(last) ? last : 'now'; history.replaceState(null, '', '#' + t); }
  show(t);
  loadPsn();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadPsn(); else saveScroll(); });
}
init();
</script>
</body>
</html>
